name: Android Factory Build

on:
  workflow_call:
    inputs:
      project_path:
        description: Ruta del proyecto Android dentro del repositorio
        required: false
        type: string
        default: '.'
      artifact_name:
        description: Nombre del artifact publicado
        required: false
        type: string
        default: android-debug-apk
      gradle_version:
        description: Versión de Gradle verificada
        required: false
        type: string
        default: '8.9'
      android_api:
        description: API de Android que se instalará
        required: false
        type: string
        default: '35'
  workflow_dispatch:
    inputs:
      project_path:
        description: Ruta del proyecto a compilar
        required: true
        type: string
        default: templates/native-lite
      artifact_name:
        description: Nombre del artifact
        required: true
        type: string
        default: factory-manual-apk
      gradle_version:
        description: Versión de Gradle
        required: true
        type: string
        default: '8.9'
      android_api:
        description: API Android
        required: true
        type: string
        default: '35'

permissions:
  contents: read

concurrency:
  group: android-factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Validar y generar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Verificar estructura Android
        working-directory: ${{ inputs.project_path }}
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Android SDK ${{ inputs.android_api }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${{ inputs.android_api }}" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle ${{ inputs.gradle_version }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Validar y compilar
        working-directory: ${{ inputs.project_path }}
        run: gradle lintDebug assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.project_path }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resumen
        run: |
          echo "## ✅ APK generado" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: **${{ inputs.artifact_name }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
