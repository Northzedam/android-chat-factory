plugins {
    id 'com.android.application'
}

def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def generatedVersionCode = ciRunNumber != null ? ciRunNumber.toInteger() : 1

android {
    namespace 'com.northzedam.factorysample'
    compileSdk 35

    defaultConfig {
        applicationId 'com.northzedam.factorysample'
        minSdk 24
        targetSdk 35
        versionCode generatedVersionCode
        versionName '1.0.0'
    }

    signingConfigs {
        development {
            storeFile file('factory-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.development
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}
